media:
  input: src/assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: お知らせ・ブログ
    type: collection
    path: src/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 公開日
        type: date
        required: true
      - name: excerpt
        label: 一覧用の短い説明
        type: text
      - name: body
        label: 本文
        type: rich-text
